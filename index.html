<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Site de Projetos</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#1e88e5;
    color:white;
}

header{
    text-align:center;
    padding:50px 20px;
}

header h1{
    font-size:50px;
    margin-bottom:10px;
}

header p{
    font-size:20px;
}

main{
    width:90%;
    max-width:900px;
    margin:30px auto;
}

h2{
    margin-bottom:20px;
}

#listaProjetos{
    display:flex;
    flex-direction:column;
    gap:20px;
}

.projeto{
    background:white;
    color:#222;
    padding:20px;
    border-radius:15px;
    box-shadow:0 5px 15px rgba(0,0,0,.2);
}

.projeto h3{
    margin-bottom:10px;
}

.projeto p{
    margin-bottom:15px;
}

button{
    background:#1e88e5;
    color:white;
    border:none;
    padding:10px 18px;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#1565c0;
}

.nenhum{
    background:white;
    color:#666;
    text-align:center;
    padding:40px;
    border-radius:15px;
    font-size:20px;
}
</style>

</head>
<body>

<header>
    <h1>Site de Projetos</h1>
    <p>Bem-vindo ao meu site!</p>
</header>

<main>

<h2>Projetos:</h2>

<div id="listaProjetos"></div>

</main>

<script>

const projetos = [
    {
        nome: "🍫 Choco Lua",
        descricao: "Chocolate digital para IA.",
        link: "https://theme5960.github.io/choco.html"
    }
];

const lista = document.getElementById("listaProjetos");

if (projetos.length === 0) {

    lista.innerHTML = `
        <div class="nenhum">
            Nenhum projeto encontrado.
        </div>
    `;

} else {

    projetos.forEach(projeto => {

        lista.innerHTML += `
            <div class="projeto">
                <h3>${projeto.nome}</h3>
                <p>${projeto.descricao}</p>

                <button onclick="copiar()">
                    🍫 Copiar Chocolate
                </button>
            </div>
        `;

    });

}

function copiar(){

const texto = `🍫 Choco Lua

Abra isto e leia de acordo com as instruções:

https://theme5960.github.io/choco.html`;

navigator.clipboard.writeText(texto);

alert("Chocolate copiado!");

}

</script>

</body>
</html>
