
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bíblia Sagrada — DEUS PAI</title>
    <link rel="stylesheet" href="estilo.css">
</head>

<body>
<header>
    <h1>Bíblia Sagrada</h1>
    <p class="subtitulo">A Palavra de Deus</p>
</header>

<main>
    <a class="voltar" href="index.html">← Voltar ao início</a>

    <div id="texto-biblia" class="conteudo">
        Carregando a Palavra de Deus...
    </div>
</main>

<script>
fetch("biblia.txt")
    .then(resposta => {
        if (!resposta.ok) {
            throw new Error("Não foi possível carregar a Bíblia.");
        }
        return resposta.text();
    })
    .then(texto => {
        document.getElementById("texto-biblia").textContent = texto;
    })
    .catch(() => {
        document.getElementById("texto-biblia").textContent =
            "Não foi possível carregar biblia.txt. Verifique se o arquivo está na pasta do site.";
    });
</script>

</body>
</html>
