
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bíblia Sagrada - DEUS PAI</title>
<link rel="stylesheet" href="estilo.css">
</head>
<body>

<header>
    <h1>Bíblia Sagrada</h1>
    <p class="subtitulo">A Palavra de Deus</p>
</header>

<main>
    <a class="voltar" href="index.html">← Voltar ao início</a>
    <div id="biblia" class="conteudo">Carregando...</div>
</main>

<script>
const area = document.getElementById("biblia");

fetch("./biblia.json")
    .then(resposta => {
        if (!resposta.ok) {
            throw new Error(`Não foi possível abrir biblia.json (${resposta.status})`);
        }
        return resposta.json();
    })
    .then(dados => {
        const testamentos = [
            { nome: "Antigo Testamento", livros: dados.antigoTestamento },
            { nome: "Novo Testamento", livros: dados.novoTestamento }
        ];

        if (testamentos.some(testamento => !Array.isArray(testamento.livros))) {
            throw new Error("Formato inesperado em biblia.json");
        }

        area.textContent = "";

        testamentos.forEach(testamento => {
            const titulo = document.createElement("h2");
            titulo.textContent = testamento.nome;
            area.appendChild(titulo);

            testamento.livros.forEach(livro => {
                const nome = document.createElement("h2");
                nome.textContent = livro.nome;
                area.appendChild(nome);

                livro.capitulos.forEach(capitulo => {
                    const cap = document.createElement("h3");
                    cap.textContent = "Capítulo " + capitulo.capitulo;
                    area.appendChild(cap);

                    const texto = document.createElement("p");
                    texto.textContent = capitulo.versiculos
                        .map(versiculo => `${versiculo.versiculo} ${versiculo.texto}`)
                        .join("\n");
                    area.appendChild(texto);
                });
            });
        });
    })
    .catch(erro => {
        console.error("Erro ao carregar a Bíblia:", erro);
        area.textContent =
            "Não foi possível carregar a Bíblia. Verifique se biblia.json está na mesma pasta desta página.";
    });
</script>

</body>
</html>
